# Congo Blog 主配置文件
baseURL = "https://yourdomain.com/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "My Blog"
theme = "congo"

# 文章路径格式
[permalinks]
  posts = "/articles/:slugorcontentbasename/"

# 分页
[pagination]
  pagerSize = 10

# 分类
[taxonomies]
  tag = "tags"
  category = "categories"

# 启用 Emoji
enableEmoji = true
# 启用 Git 信息
enableGitInfo = false
# 生成 robots.txt
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # 允许 HTML 直出

# 全局菜单
[[menu.main]]
  name = "文章"
  pageRef = "/posts"
  weight = 10

[[menu.main]]
  name = "标签"
  pageRef = "/tags"
  weight = 20

[[menu.main]]
  name = "关于"
  pageRef = "/about"
  weight = 30

[[menu.main]]
  name = ""
  weight = 40
  [menu.main.params]
    action = "appearance"
    showName = false

# Congo 主题参数
[params]
  # 配色
  colorScheme = "congo"

  # 主页布局: page(普通), profile(个人介绍), custom(自定义)
  homepage.layout = "page"
  homepage.showRecent = true
  homepage.showRecentItems = 5
  homepage.showRecentLink = "查看更多"

  # 文章列表
  list.showBreadcrumbs = true
  list.showTableOfContents = false
  list.showSummary = true
  list.showTags = true
  list.showDate = true
  list.showReadingTime = true
  list.showWordCount = false

  # 文章详情
  article.showBreadcrumbs = true
  article.showTableOfContents = true
  article.showDate = true
  article.showDateUpdated = true
  article.showReadingTime = true
  article.showWordCount = false
  article.showTags = true
  article.showEdit = false
  article.showPagination = true
  article.showZenMode = false
  # 启用评论（接入 Go 后端 API）
  article.showComments = true

  # 社交链接
  [params.author]
    name = "Blog Author"
    image = "img/author.jpg"
    headline = "分享技术与生活"
    links = [
      { github = "https://github.com/" }
    ]

  # 页脚
  [params.footer]
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = false
    showScrollToTop = true

  # SEO
  [params.fathomAnalytics]
    site = ""
  [params.verification]
    google = ""

  # 搜索 (Fuse.js)
  [params.fuseSearch]
    enable = false
