<h2 class="mb-6 text-2xl font-bold text-neutral-800 dark:text-neutral-100">评论管理</h2>
<div id="comment-msg" class="mb-4 hidden rounded-lg px-4 py-3 text-sm"></div>
<div id="comments-loading" class="py-12 text-center text-neutral-400">
  <div class="mx-auto mb-3 h-6 w-6 animate-spin rounded-full border-2 border-neutral-300 border-t-primary-500"></div>加载中...  
</div>
<div id="comments-table" class="hidden overflow-hidden rounded-xl border border-neutral-200 bg-white shadow-sm dark:border-neutral-700 dark:bg-neutral-800">
  <table class="w-full text-sm">
    <thead class="bg-neutral-50 text-left text-neutral-500 dark:bg-neutral-800">
      <tr>
        <th class="px-4 py-3 font-medium">昵称</th>
        <th class="px-4 py-3 font-medium">邮箱</th>
        <th class="px-4 py-3 font-medium">内容</th>
        <th class="px-4 py-3 font-medium hidden md:table-cell">时间</th>
        <th class="px-4 py-3 font-medium text-right">操作</th>
      </tr>
    </thead>
    <tbody id="comments-tbody" class="divide-y divide-neutral-100 dark:divide-neutral-700"></tbody>
  </table>
</div>
<div id="comments-empty" class="hidden rounded-xl border border-neutral-200 bg-white p-12 text-center text-neutral-400 shadow-sm dark:border-neutral-700 dark:bg-neutral-800">暂无评论</div>
<script src="{{ "js/admin/comments.js" | relURL }}"></script>
