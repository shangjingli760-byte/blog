<style>
  /* 覆盖 Congo 主题样式，确保登录卡片完整显示在最上层 */
  html body { max-width: none !important; margin: 0 !important; padding: 0 !important; }
  body > header { display: none !important; }
  body > div#the-top { display: none !important; }
</style>
<div class="fixed inset-0 z-[99999] flex items-center justify-center">
  <!-- 小纯白背景区域 -->
  <div class="rounded-2xl bg-white p-8 shadow-xl dark:bg-neutral-800" style="width:320px">
    <div>
      <!-- 窗口标题栏 -->
      <div class="mb-4 flex items-center gap-2 border-b border-neutral-100 pb-3 dark:border-neutral-700">
        <span class="h-3 w-3 rounded-full bg-red-400"></span>
        <span class="h-3 w-3 rounded-full bg-yellow-400"></span>
        <span class="h-3 w-3 rounded-full bg-green-400"></span>
        <span class="ml-2 text-xs font-medium text-neutral-400">管理后台登录</span>
      </div>
      <!-- 窗口内容 -->
      <form class="space-y-4" onsubmit="return false;">
        <div id="login-error" class="hidden rounded-lg bg-red-50 px-4 py-2.5 text-xs text-red-600 dark:bg-red-900/20 dark:text-red-400"></div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-neutral-700 dark:text-neutral-300">用户名</label>
          <input type="text" id="login-username" autocomplete="username" class="w-full rounded-lg border border-neutral-300 bg-neutral-50 px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-200 dark:border-neutral-600 dark:bg-neutral-700 dark:text-neutral-200" placeholder="请输入用户名">
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-neutral-700 dark:text-neutral-300">密码</label>
          <input type="password" id="login-password" autocomplete="current-password" class="w-full rounded-lg border border-neutral-300 bg-neutral-50 px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-200 dark:border-neutral-600 dark:bg-neutral-700 dark:text-neutral-200" placeholder="请输入密码">
        </div>
        <button type="button" id="login-btn" class="w-full rounded-lg bg-primary-600 px-4 py-2 text-sm font-medium text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-300 disabled:cursor-not-allowed disabled:opacity-50 transition-colors">
          登 录
        </button>
      </form>
    </div>
  </div>
</div>
<script>
(function(){
  var btn = document.getElementById('login-btn');
  var err = document.getElementById('login-error');
  btn.addEventListener('click', async function(){
    var u = document.getElementById('login-username').value.trim();
    var p = document.getElementById('login-password').value;
    if (!u || !p) { err.textContent = '请填写用户名和密码'; err.classList.remove('hidden'); return; }
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      var res = await adminApi.post('/api/admin/login', { username: u, password: p });
      if (res.code === 0) {
        localStorage.setItem('admin_token', res.data.token);
        window.location.href = '/admin/';
      } else {
        err.textContent = res.msg || '登录失败';
        err.classList.remove('hidden');
      }
    } catch(e) {
      err.textContent = '网络错误，请稍后重试';
      err.classList.remove('hidden');
    }
    btn.disabled = false; btn.textContent = '登 录';
  });
  document.getElementById('login-password').addEventListener('keydown', function(e){
    if (e.key === 'Enter') btn.click();
  });
})();
</script>
